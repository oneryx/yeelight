name: release

# A v* tag builds the desktop app for macOS, Windows and Linux and publishes
# it as a GitHub release. The tag must match the version in mygo.json.
on:
  push:
    tags: ['v*']

permissions:
  contents: write # the release, and the uploads to it

jobs:
  draft:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check the tag matches mygo.json
        run: test "$GITHUB_REF_NAME" = "v$(jq -r .version mygo.json)"

      # A draft, so the release only shows once every platform is uploaded
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --draft --verify-tag \
              --title "$GITHUB_REF_NAME" --generate-notes
          fi

  build:
    needs: draft
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Disk images need macOS; MyGo needs no cgo, so Linux builds the rest
          - { name: macOS, os: macos-latest, platform: darwin/universal }
          - { name: Windows, os: ubuntu-latest, platform: 'windows/amd64,windows/arm64' }
          - { name: Linux, os: ubuntu-latest, platform: 'linux/amd64,linux/arm64' }
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Install NSIS, for the Windows installers
        if: matrix.name == 'Windows'
        run: sudo apt-get update && sudo apt-get install -y nsis

      - run: go tool mygo build -platform "${{ matrix.platform }}"

      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          files=(build/*/*.dmg build/*/*Setup*.exe build/*/*.deb build/*/*.tar.gz)
          test ${#files[@]} -gt 0
          gh release upload "$GITHUB_REF_NAME" "${files[@]}" --clobber
          if [ "${{ matrix.name }}" = Linux ]; then
            gh release upload "$GITHUB_REF_NAME" build/linux-amd64/install.sh --clobber
          fi

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false
